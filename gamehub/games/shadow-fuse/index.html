<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shadow Fuse</title>
<link rel="icon" href="./assets/favicon.png">
<style>
:root{
  --cyan:#22d3ee; --orange:#fb923c; --red:#ef4444; --gold:#fbbf24;
  --bg:#0d0f16; --panel:#161a26; --panel2:#1e2333; --txt:#e8ecf4; --dim:#8b93a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--txt);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
canvas{display:block;position:fixed;inset:0}
#dev{position:fixed;top:4px;left:4px;color:#0f0;font:12px monospace;display:none;z-index:99;pointer-events:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;
  background:rgba(9,11,18,.72);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .28s}
.screen.show{opacity:1;pointer-events:auto}
#home{background:#0d0f16 url("./assets/cover_bg.jpg") center/cover no-repeat}
#home::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(10,12,20,.25),rgba(9,11,18,.88) 78%)}
#home>*{position:relative}
.logo{font-size:clamp(40px,9vw,88px);font-weight:900;letter-spacing:.08em;margin:0;
  background:linear-gradient(180deg,#fff,var(--cyan) 45%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(34,211,238,.5)) drop-shadow(0 6px 30px rgba(251,146,60,.35));animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{50%{filter:drop-shadow(0 0 34px rgba(34,211,238,.75)) drop-shadow(0 6px 44px rgba(251,146,60,.5))}}
.tagline{color:var(--dim);font-size:clamp(14px,2.6vw,19px);letter-spacing:.14em;margin:10px 0 34px;text-transform:uppercase}
.btn{cursor:pointer;border:0;border-radius:14px;font-weight:800;letter-spacing:.06em;color:#0a0c12;
  background:linear-gradient(135deg,var(--cyan),#67e8f9);box-shadow:0 0 24px rgba(34,211,238,.4),0 6px 18px rgba(0,0,0,.5);
  transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 38px rgba(34,211,238,.65),0 10px 24px rgba(0,0,0,.5)}
.btn:active{transform:scale(.97)}
.btn.big{font-size:clamp(20px,4vw,30px);padding:18px 74px;animation:btnPulse 1.8s ease-in-out infinite}
@keyframes btnPulse{50%{box-shadow:0 0 44px rgba(34,211,238,.75),0 6px 18px rgba(0,0,0,.5)}}
.btn.ghost{background:var(--panel2);color:var(--txt);box-shadow:0 4px 12px rgba(0,0,0,.45);font-size:15px;padding:12px 26px}
.btn.ghost:hover{box-shadow:0 0 18px rgba(139,147,168,.35)}
.row{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.toggles{display:flex;gap:10px;margin-top:26px}
.tog{cursor:pointer;background:var(--panel2);border:1px solid #2b3247;border-radius:10px;color:var(--dim);font-size:13px;padding:8px 16px;font-weight:700}
.tog.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.3)}
.panel{background:var(--panel);border:1px solid #262c40;border-radius:18px;max-width:640px;width:min(92vw,640px);
  max-height:86vh;overflow:auto;padding:26px 26px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.panel h2{margin:0 0 16px;font-size:24px;letter-spacing:.06em}
.optGroup{margin-bottom:16px}
.optGroup label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:7px;font-weight:700}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{cursor:pointer;background:var(--panel2);border:1px solid #2b3247;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;color:var(--dim);transition:all .12s}
.opt:hover{border-color:#3d4763}
.opt.sel{color:#0a0c12;background:linear-gradient(135deg,var(--cyan),#67e8f9);border-color:transparent;box-shadow:0 0 14px rgba(34,211,238,.4)}
.opt small{display:block;font-weight:400;font-size:11px;opacity:.75;max-width:180px}
.htPanel{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.htCard{background:var(--panel2);border:1px solid #2b3247;border-radius:14px;padding:18px;width:170px}
.htCard .ico{font-size:34px;height:44px}
.htCard h3{margin:4px 0 8px;font-size:15px;color:var(--cyan)}
.htCard p{margin:0;font-size:12.5px;line-height:1.5;color:var(--dim)}
#results .rTitle{font-size:clamp(36px,8vw,72px);font-weight:900;letter-spacing:.1em;margin:0 0 6px;text-align:center;padding:0 10px}
#results .rTitle.win{color:var(--gold);text-shadow:0 0 30px rgba(251,191,36,.7),0 0 60px rgba(251,146,60,.4)}
#results .rTitle.lose{color:#9aa3b8;text-shadow:0 0 24px rgba(120,130,160,.4)}
#results .rTitle.draw{color:var(--red);text-shadow:0 0 30px rgba(239,68,68,.6)}
#results .rHi{color:var(--txt);font-size:clamp(14px,2.4vw,17px);margin:2px 0 18px;max-width:520px;text-align:center;padding:0 16px}
.stats{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
.stat{text-align:center}
.stat b{display:block;font-size:26px;color:var(--cyan)}
.stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#pauseBtn{position:fixed;top:12px;left:12px;z-index:5;width:40px;height:40px;border-radius:10px;border:1px solid #2b3247;
  background:rgba(22,26,38,.7);color:var(--dim);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center}
#pauseBtn.show{display:flex}
#botSay{position:fixed;top:96px;right:12px;max-width:210px;z-index:12;pointer-events:none;
  background:#1e2333;border:1px solid rgba(251,146,60,.45);border-radius:12px 4px 12px 12px;
  color:var(--orange);font-size:13px;font-weight:700;padding:8px 12px;
  opacity:0;transform:translateY(-8px);transition:opacity .22s,transform .22s;
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
#botSay.show{opacity:1;transform:none}
#rStamp{position:absolute;top:16%;right:12%;transform:rotate(13deg);display:none;
  font-size:clamp(24px,5vw,38px);font-weight:900;letter-spacing:.12em;color:var(--gold);
  border:4px solid var(--gold);border-radius:12px;padding:8px 18px;
  text-shadow:0 0 20px rgba(251,191,36,.85);box-shadow:0 0 28px rgba(251,191,36,.35),inset 0 0 18px rgba(251,191,36,.15)}
#rStamp.show{display:block;animation:stampIn .38s cubic-bezier(.2,2.2,.4,1)}
@keyframes stampIn{from{transform:rotate(13deg) scale(2.6);opacity:0}}
#rStreak{color:var(--gold);font-size:clamp(13px,2.4vw,16px);font-weight:800;letter-spacing:.06em;margin:-8px 0 16px;min-height:20px}
.credit{font-size:11px;color:#525a70;letter-spacing:.08em}
#home .credit{position:absolute;bottom:12px;left:0;right:0;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dev"></div>
<button id="pauseBtn" aria-label="pause">❚❚</button>
<div id="botSay"></div>

<div id="home" class="screen show">
  <h1 class="logo" id="logoTxt"></h1>
  <div class="tagline" id="tagTxt"></div>
  <button class="btn big" id="playBtn"></button>
  <div class="row">
    <button class="btn ghost" id="howBtn"></button>
    <button class="btn ghost" id="setBtn"></button>
  </div>
  <div class="toggles">
    <button class="tog on" id="sndTog"></button>
    <button class="tog on" id="musTog"></button>
  </div>
  <div class="credit">1v1 vs the machine · first flame to the bomb wins</div>
</div>

<div id="settings" class="screen">
  <div class="panel">
    <h2 id="setTitle"></h2>
    <div id="optArea"></div>
    <div class="row"><button class="btn ghost" id="setBack"></button></div>
  </div>
</div>

<div id="howto" class="screen">
  <div class="panel">
    <h2 id="howTitle"></h2>
    <div class="htPanel" id="htCards"></div>
    <div class="row"><button class="btn ghost" id="howBack"></button></div>
  </div>
</div>

<div id="pause" class="screen">
  <div class="panel" style="text-align:center;max-width:360px">
    <h2 id="pauseTitle"></h2>
    <div class="row" style="flex-direction:column;align-items:center">
      <button class="btn" style="padding:12px 40px" id="resumeBtn"></button>
      <button class="btn ghost" id="restartBtn"></button>
      <button class="btn ghost" id="quitBtn"></button>
    </div>
  </div>
</div>

<div id="results" class="screen">
  <div id="rStamp"></div>
  <div class="rTitle" id="rTitle"></div>
  <div class="rHi" id="rHi"></div>
  <div id="rStreak"></div>
  <div class="stats" id="rStats"></div>
  <button class="btn big" id="replayBtn"></button>
  <div class="row"><button class="btn ghost" id="rSetBtn"></button></div>
</div>

<script type="module" src="./game.js?v=2"></script>
</body>
</html>
